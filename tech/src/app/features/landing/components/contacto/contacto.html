<section id="contacto" class="contacto-container">
  <h2 class="mat-headline-medium title">{{ tituloSeccion }}</h2>

  <form (ngSubmit)="onSubmit()" class="contacto-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre completo</mat-label>
      <input matInput [(ngModel)]="formData.nombre" name="nombre" required>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Correo electrónico</mat-label>
      <input matInput type="email" [(ngModel)]="formData.email" name="email" required>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Mensaje</mat-label>
      <textarea matInput rows="4" [(ngModel)]="formData.mensaje" name="mensaje" required></textarea>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" class="full-width btn-submit">
      Enviar Mensaje
    </button>
  </form>
</section>
